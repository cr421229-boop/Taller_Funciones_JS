<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1 id="titulo_formulario">Formulario de Contacto</h1>
  <form id="form_contacto">

    <div id="Nombre">
      <label for="nombre">Nombre:</label><br>
      <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
    </div>
    <br>

    <div id="Apellido">
      <label for="apellido">Apellido:</label><br>
      <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez" required>
    </div>
    <br>

    <div id="Tipo_identificacion">
      <label for="tipo_identificacion">Tipo de Identificación:</label><br>
      <select id="tipo_identificacion" name="tipo_identificacion" required>
        <option value="" disabled selected>Seleccione una opción</option>
        <option value="13 - Cédula de Ciudadanía (CC)">Cédula de Ciudadanía (CC)</option>
        <option value="12 - Tarjeta de Identidad (TI)">Tarjeta de Identidad (TI)</option>
        <option value="41 - Pasaporte (PA)">Pasaporte (PA)</option>
      </select>
    </div>
    <br>

    <div id="Numero_identificacion">
      <label for="numero_identificacion">Número de Identificación:</label><br>
      <input type="text" id="numero_identificacion" name="numero_identificacion" placeholder="Ej: 1020304050" required>
    </div>
    <br>

    <div id="Fecha_nacimiento">
      <label for="fecha_nacimiento">Fecha de Nacimiento:</label><br>
      <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" placeholder="dd/mm/aaaa" required>
    </div>
    <br>

    <div id="Celular">
      <label for="celular">Número de Celular:</label><br>
      <input type="tel" id="celular" name="celular" pattern="[0-9]{10}" placeholder="3001234567" required>
    </div>
    <br>

    <div id="Pais">
      <label for="pais">País:</label><br>
      <select id="pais" name="pais" required>
        <option value="" disabled>Seleccionar</option>
        <option value="169 - Colombia" selected>Colombia</option>
        <option value="493 - México">México</option>
        <option value="589 - Perú">Perú</option>
      </select>
    </div>
    <br>

    <div id="Ciudad">
      <label for="ciudad">Ciudad:</label><br>
      <select id="ciudad" name="ciudad" required>
        <option value="" disabled selected>Seleccione una opción</option>
        <optgroup label="Colombia">
          <option value="11001 - Bogotá D.C.">Bogotá D.C.</option>
          <option value="05001 - Medellín">Medellín</option>
          <option value="76001 - Cali">Cali</option>
          <option value="08001 - Barranquilla">Barranquilla</option>
          <option value="13001 - Cartagena">Cartagena</option>
        </optgroup>
        <optgroup label="México">
          <option value="09 - Ciudad de México">Ciudad de México</option>
          <option value="14039 - Guadalajara">Guadalajara</option>
          <option value="19039 - Monterrey">Monterrey</option>
          <option value="21114 - Puebla">Puebla</option>
          <option value="02004 - Tijuana">Tijuana</option>
        </optgroup>
        <optgroup label="Perú">
          <option value="150101 - Lima">Lima</option>
          <option value="040101 - Arequipa">Arequipa</option>
          <option value="130101 - Trujillo">Trujillo</option>
          <option value="080101 - Cusco">Cusco</option>
          <option value="200101 - Piura">Piura</option>
        </optgroup>
      </select>
    </div>
    <br>

    <div id="Politica_datos">
      <input type="checkbox" id="politica_datos" name="politica_datos" required>
      <label for="politica_datos">Acepto la política de tratamiento de datos.</label>
    </div>
    <br>

    <div id="Submit">
      <input type="submit" id="boton_enviar" value="Enviar">
    </div>

  </form>

  <script src="js/script.js"></script>
</body>
</html>
